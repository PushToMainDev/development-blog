<header class="site-header">
  <div class="shell nav-wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="prompt">&gt;_</span> PushToMainDev Blog
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
      <span class="sr-only">Menu</span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <details class="nav-dropdown">
        <summary>Projects</summary>
        <div class="nav-dropdown-menu">
          {% assign nav_products = site.products | sort: "order" %}
          {% for product in nav_products %}
            <a href="{{ product.url | relative_url }}"{% if page.url == product.url %} aria-current="page"{% endif %}>
              {{ product.title }}
              {% if product.status %}<span class="nav-dropdown-status">{{ product.status }}</span>{% endif %}
            </a>
          {% endfor %}
        </div>
      </details>
      <a href="{{ '/open-source/' | relative_url }}">Open Source</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/development/' | relative_url }}">Development</a>
      <a class="admin-link" href="{{ '/admin/' | relative_url }}">Write</a>
    </nav>
  </div>
  <script>
    (function () {
      var header = document.querySelector('.site-header');
      var toggle = header.querySelector('.nav-toggle');
      var dropdown = header.querySelector('.nav-dropdown');

      function setMenu(open) {
        header.classList.toggle('is-menu-open', open);
        toggle.setAttribute('aria-expanded', String(open));
      }

      toggle.addEventListener('click', function () {
        setMenu(!header.classList.contains('is-menu-open'));
      });

      document.addEventListener('click', function (e) {
        if (dropdown && dropdown.open && !dropdown.contains(e.target) && !header.classList.contains('is-menu-open')) {
          dropdown.open = false;
        }
        if (header.classList.contains('is-menu-open') && !header.contains(e.target)) setMenu(false);
      });

      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        if (dropdown && dropdown.open) {
          dropdown.open = false;
          dropdown.querySelector('summary').focus();
        } else if (header.classList.contains('is-menu-open')) {
          setMenu(false);
          toggle.focus();
        }
      });
    })();
  </script>
</header>
