<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

 <link rel="icon"
      type="image/x-icon"
      href="{{ '/assets/icons/favicon.ico' | relative_url }}">

<link rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ '/assets/icons/favicon-32x32.png' | relative_url }}">

<link rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{ '/assets/icons/favicon-16x16.png' | relative_url }}">
  <!-- Site Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  {% include header.html %}

  <main>{{ content }}</main>

  {% include footer.html %}
</body>
</html>
