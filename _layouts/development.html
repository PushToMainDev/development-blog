<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

  <link rel="icon" type="image/x-icon" href="{{ '/assets/icons/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/icons/favicon-16x16.png' | relative_url }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>

<body class="dev-body">
  <header class="site-header dev-header">
    <div class="shell nav-wrap">
      <a class="brand" href="{{ '/development/' | relative_url }}">
        <span class="prompt">&gt;_</span> PushToMainDev <span class="dev-brand-tag">Development</span>
      </a>

      <nav aria-label="Development navigation">
        <div class="board-session" id="board-session" hidden>
          <span id="board-session-email"></span>
          <button type="button" class="board-button is-link" id="board-sign-out">Sign out</button>
        </div>
        <a class="admin-link" href="{{ '/' | relative_url }}">← Blog</a>
      </nav>
    </div>
  </header>

  <main>{{ content }}</main>
</body>
</html>
