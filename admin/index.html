<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>PushToMainDev | Blog Admin</title>

  <link rel="icon"
        type="image/x-icon"
        href="/development-blog/assets/icons/favicon.ico">

  <link rel="icon"
        type="image/png"
        sizes="32x32"
        href="/development-blog/assets/icons/favicon-32x32.png">

  <link rel="icon"
        type="image/png"
        sizes="16x16"
        href="/development-blog/assets/icons/favicon-16x16.png">
</head>

<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // "YouTube Video" button for the rich text editor. Inserts a Liquid
    // include that _includes/youtube.html renders as a responsive embed.
    //
    // The Liquid delimiters are assembled from pieces so this file stays
    // safe if it ever gains YAML front matter and Jekyll starts processing
    // it. Without front matter Jekyll copies this file verbatim.
    (function () {
      var OPEN = '{' + '%';
      var CLOSE = '%' + '}';

      // Accepts a full YouTube URL in any common shape, or a bare video ID.
      function extractId(input) {
        if (!input) return '';
        var value = String(input).trim();

        var fromUrl = value.match(
          /(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{6,})/
        );
        if (fromUrl) return fromUrl[1];

        if (/^[A-Za-z0-9_-]{6,}$/.test(value)) return value;

        return '';
      }

      function clean(text) {
        return String(text || '').replace(/["\r\n]/g, '').trim();
      }

      CMS.registerEditorComponent({
        id: 'youtube',
        label: 'YouTube Video',
        icon: 'image',

        fields: [
          {
            name: 'url',
            label: 'YouTube URL or Video ID',
            widget: 'string',
            hint: 'Paste the full link, for example https://youtu.be/dQw4w9WgXcQ'
          },
          {
            name: 'title',
            label: 'Description (for screen readers)',
            widget: 'string',
            required: false,
            hint: 'Optional. Describes the video for people using a screen reader.'
          }
        ],

        pattern: new RegExp(
          '^\\{%\\s*include\\s+youtube\\.html\\s+id="([A-Za-z0-9_-]{6,})"' +
          '(?:\\s+title="([^"]*)")?\\s*%\\}$'
        ),

        fromBlock: function (match) {
          return { url: match[1], title: match[2] || '' };
        },

        toBlock: function (data) {
          var id = extractId(data && data.url);
          if (!id) return '';

          var title = clean(data && data.title);
          var block = OPEN + ' include youtube.html id="' + id + '"';
          if (title) block += ' title="' + title + '"';
          return block + ' ' + CLOSE;
        },

        toPreview: function (data) {
          var id = extractId(data && data.url);
          if (!id) {
            return '<p style="color:#888">Paste a YouTube URL to preview it.</p>';
          }
          return (
            '<img src="https://img.youtube.com/vi/' + id + '/hqdefault.jpg"' +
            ' alt="YouTube thumbnail"' +
            ' style="max-width:100%;border-radius:8px;display:block" />'
          );
        }
      });
    })();
  </script>

  <script>
    // "Image Comparison" button for the rich text editor. Inserts a Liquid
    // include that _includes/compare.html renders as two images side by side.
    (function () {
      var OPEN = '{' + '%';
      var CLOSE = '%' + '}';
      var KEYS = ['left', 'left_label', 'right', 'right_label', 'caption'];

      function clean(text) {
        return String(text || '').replace(/["\r\n]/g, '').trim();
      }

      CMS.registerEditorComponent({
        id: 'compare',
        label: 'Image Comparison',
        icon: 'image',

        fields: [
          { name: 'left', label: 'Left image', widget: 'image' },
          {
            name: 'left_label',
            label: 'Left label',
            widget: 'string',
            required: false,
            hint: 'Optional, for example "Before" or "v1".'
          },
          { name: 'right', label: 'Right image', widget: 'image' },
          {
            name: 'right_label',
            label: 'Right label',
            widget: 'string',
            required: false,
            hint: 'Optional, for example "After" or "v2".'
          },
          {
            name: 'caption',
            label: 'Caption',
            widget: 'string',
            required: false
          }
        ],

        pattern: new RegExp('^\\{%\\s*include\\s+compare\\.html\\s+(.*?)\\s*%\\}$'),

        fromBlock: function (match) {
          var data = {};
          var attr = /(\w+)="([^"]*)"/g;
          var found;
          while ((found = attr.exec(match[1]))) data[found[1]] = found[2];
          return data;
        },

        toBlock: function (data) {
          if (!data || !data.left || !data.right) return '';

          var parts = KEYS
            .filter(function (key) { return clean(data[key]); })
            .map(function (key) { return key + '="' + clean(data[key]) + '"'; });

          return OPEN + ' include compare.html ' + parts.join(' ') + ' ' + CLOSE;
        },

        toPreview: function (data) {
          function side(src, label) {
            if (!src) {
              return '<div style="flex:1;padding:40px 10px;border:1px dashed #888;' +
                'border-radius:8px;color:#888;text-align:center">Pick an image</div>';
            }
            return '<figure style="flex:1;margin:0">' +
              '<img src="' + src + '" alt="" style="width:100%;border-radius:8px;display:block" />' +
              (label ? '<figcaption style="font-size:12px;color:#888;margin-top:4px">' + clean(label) + '</figcaption>' : '') +
              '</figure>';
          }

          return '<div style="display:flex;gap:12px;align-items:flex-start">' +
            side(data && data.left, data && data.left_label) +
            side(data && data.right, data && data.right_label) +
            '</div>' +
            (data && data.caption
              ? '<p style="text-align:center;font-size:13px;color:#888">' + clean(data.caption) + '</p>'
              : '');
        }
      });
    })();
  </script>
</body>
</html>
