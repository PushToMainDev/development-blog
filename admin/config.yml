backend:
  name: github
  repo: PushToMainDev/development-blog
  branch: main
  base_url: https://pushtomaindev-blog-auth.vercel.app
  auth_endpoint: api/auth

site_url: https://pushtomaindev.github.io/development-blog
display_url: https://pushtomaindev.github.io/development-blog

media_folder: "assets/uploads"
public_folder: "/development-blog/assets/uploads"

collections:

  - name: products
    label: Products
    label_singular: Product
    folder: "_products"
    create: true
    identifier_field: product_id
    slug: "{{fields.product_id}}"
    extension: md
    format: frontmatter

    fields:
      - { label: Layout, name: layout, widget: hidden, default: product }

      - { label: Product Name, name: title, widget: string }

      - label: Product ID
        name: product_id
        widget: string
        hint: "Use lowercase letters and hyphens, for example: kin-kitchen"

      - label: Status
        name: status
        widget: select
        options:
          - Concept
          - Planning
          - Development
          - Alpha
          - Beta
          - Released
          - Active
          - Paused
          - Archived
        default: Development

      - { label: Description, name: description, widget: text }

      - {
          label: Product Website,
          name: website,
          widget: string,
          required: false
        }

      - label: Sort Order
        name: order
        widget: number
        value_type: int
        default: 50


  - name: posts
    label: Blog Posts
    label_singular: Blog Post
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter

    fields:
      - { label: Layout, name: layout, widget: hidden, default: post }

      - { label: Title, name: title, widget: string }

      - label: Product
        name: product
        widget: relation
        collection: products
        search_fields:
          - title
          - product_id
        value_field: product_id
        display_fields:
          - title
        required: true

      - {
          label: Author,
          name: author,
          widget: string,
          default: "Greg Hudler"
        }

      - {
          label: Publish Date,
          name: date,
          widget: datetime
        }

      - {
          label: Summary,
          name: description,
          widget: text,
          required: false
        }

      - {
          label: Tags,
          name: tags,
          widget: list,
          required: false
        }

      - label: Featured Image
        name: image
        widget: image
        required: false

      - {
          label: Body,
          name: body,
          widget: markdown
        }